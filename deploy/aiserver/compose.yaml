name: huawei-traffic

services:
  worker:
    image: huawei-traffic:20261124
    build:
      context: ./source
      dockerfile: deploy/aiserver/Dockerfile
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    command:
      - --model
      - /data/best.pt
      - --sources-file
      - /data/huawei-rtsp.txt
      - --calibration-file
      - /data/camera_regions.json
      - --events-db
      - /data/traffic_events.sqlite3
      - --imgsz
      - "960"
      - --half
      - --device
      - "0"
      - --port
      - "8000"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:18093:8000"
      - "127.0.0.1:18094:8001"
      - "127.0.0.1:18095:8002"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/traffic/cameras', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: nginx@sha256:5878d06ae4c83d73285438255f705bb3f9a736f41cd24876ed25bb33faf76c7d
    entrypoint: [nginx, -c, /etc/nginx/huawei/nginx.conf, -g, "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    ports:
      - "192.168.1.25:18090:8443"
    volumes:
      - ./proxy:/etc/nginx/huawei:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "wget -S --no-check-certificate --spider https://127.0.0.1:8443/api/traffic/cameras 2>&1 | grep -q '401 Unauthorized'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
