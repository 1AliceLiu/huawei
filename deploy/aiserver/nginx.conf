pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    default_type application/json;
    server_tokens off;
    map_hash_bucket_size 128;

    map $http_authorization $authorized {
        default 0;
        include /etc/nginx/huawei/token.conf;
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/huawei/aiserver.crt;
        ssl_certificate_key /etc/nginx/huawei/aiserver.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ~ ^/api/traffic/(cameras|events)$ {
            if ($authorized = 0) {
                return 401 '{"error":"unauthorized"}';
            }
            limit_except GET {
                deny all;
            }
            proxy_pass http://worker:8000;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_read_timeout 15s;
        }

        location / {
            return 404 '{"error":"not_found"}';
        }
    }
}
