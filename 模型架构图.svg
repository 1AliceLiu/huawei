</text><rect x="715" y="356" width="405" height="88" rx="12" fill="#e8f4ff" stroke="#8ab5d7" stroke-width="1.5"/><text x="917.5" y="398.0" text-anchor="middle" font-size="17" font-weight="700" fill="#17253b">上采样 ×2 + P3 拼接</text><text x="917.5" y="422.0" text-anchor="middle" font-size="13" fill="#52647b">C3k2 → N3 (P3 / 8)</text><rect x="715" y="474" width="405" height="88" rx="12" fill="#e8f4ff" stroke="#8ab5d7" stroke-width="1.5"/><text x="917.5" y="516.0" text-anchor="middle" font-size="17" font-weight="700" fill="#17253b">下采样 ×2 + N4 拼接</text><text x="917.5" y="540.0" text-anchor="middle" font-size="13" fill="#52647b">C3k2 → O4 (P4 / 16)</text><rect x="715" y="592" width="405" height="88" rx="12" fill="#e8f4ff" stroke="#8ab5d7" stroke-width="1.5"/><text x="917.5" y="634.0" text-anchor="middle" font-size="17" font-weight="700" fill="#17253b">下采样 ×2 + P5 拼接</text><text x="917.5" y="658.0" text-anchor="middle" font-size="13" fill="#52647b">C3k2 → O5 (P5 / 32)</text><path d="M917 326 L917 352" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M917 444 L917 470" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M917 562 L917 588" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M615 723 H670 V282 H709" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M615 543 H686 V282 H709" fill="none" stroke="#8aa8c6" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M615 453 H697 V400 H709" fill="none" stroke="#8aa8c6" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="1220" y="263" width="295" height="150" rx="12" fill="#e9f7ef" stroke="#8cbea0" stroke-width="1.5"/><text x="1367.5" y="336.0" text-anchor="middle" font-size="22" font-weight="700" fill="#17253b">Detect [P3, P4, P5]</text><text x="1367.5" y="360.0" text-anchor="middle" font-size="13" fill="#52647b">Ultralytics 内置 · nc = 12</text><tex