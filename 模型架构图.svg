<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-labelledby="title desc">
<title id="title">YOLO26m 车辆检测模型架构</title>
<desc id="desc">输入图像经过骨干网络的 P3、P4、P5 特征，经过自顶向下和自底向上的特征融合，再由端到端检测头输出 12 类车辆的边界框和类别置信度。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs>
<rect width="1600" height="970" fill="#f7f9fc"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif">
<text x="50" y="65" font-size="36" font-weight="700" fill="#12243c">YOLO26m 车辆检测模型架构</text>
<text x="50" y="99" font-size="17" fill="#51647d">仓库实际配置 · 水平边界框检测 · 训练时类别数 nc = 12</text>
<path d="M50 122 H1550" stroke="#d4deea" stroke-width="2"/>
